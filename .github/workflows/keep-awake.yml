# Render's free plan puts the backend to sleep after 15 minutes without a
# request, and the next capture then waits 30-60 s for it to wake. Pinging the
# health check every 10 minutes keeps it awake.
#
# Only 05:00-22:00 UTC: the free plan's 750 hours a month are shared by every
# free service on the Render account, and keeping this one awake round the
# clock would use nearly all of them. GitHub may run scheduled jobs a few
# minutes late; that's fine here.
name: Keep backend awake

on:
  schedule:
    - cron: "*/10 5-21 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health check
        run: curl --silent --show-error --max-time 90 --retry 2 --output /dev/null --write-out "%{http_code} in %{time_total}s\n" https://visionlearn.fyi/api/v1/health
