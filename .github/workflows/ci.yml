# Runs the backend tests and builds the extension on every push and pull
# request, so a change that breaks either is caught before it reaches main
# (Render deploys main automatically, render.yaml).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e "./backend[dev]"
      - name: Test
        run: python -m pytest -q

  extension:
    name: Extension build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Build the Chrome Web Store variant
        # The store refuses a manifest with a "key" (vite.config.ts strips it).
        run: |
          STORE_BUILD=1 npm run build
          node -e 'const m = require("./dist/manifest.json"); if ("key" in m) { console.error("manifest still has a key"); process.exit(1); }'
