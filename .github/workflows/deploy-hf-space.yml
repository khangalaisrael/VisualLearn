# Deploys the backend to a Hugging Face Docker Space (docs/DEPLOY_HF.md).
#
# Setup (GitHub repo → Settings → Secrets and variables → Actions):
#   secret   HF_TOKEN  — Hugging Face access token with write access
#   variable HF_SPACE  — the Space id, e.g. yourname/visionlearn
# Without HF_SPACE set, the job is skipped, so forks and unconfigured
# clones don't fail.
name: Deploy backend to Hugging Face

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "prompts/**"
      - "deploy/huggingface/**"
      - ".github/workflows/deploy-hf-space.yml"
  workflow_dispatch:

concurrency:
  group: deploy-hf-space
  cancel-in-progress: true

jobs:
  deploy:
    if: vars.HF_SPACE != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble Space contents
        run: |
          mkdir space
          cp -r backend prompts space/
          cp deploy/huggingface/Dockerfile deploy/huggingface/start.sh deploy/huggingface/README.md space/

      - name: Push to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          cd space
          git init -q -b main
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7} from GitHub"
          # The Space is a deploy target, not a source of truth: overwrite it.
          git push --force -q "https://${HF_SPACE%%/*}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
