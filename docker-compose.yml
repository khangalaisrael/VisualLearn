services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-visionlearn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-visionlearn}
      POSTGRES_DB: ${POSTGRES_DB:-visionlearn}
    volumes:
      - visionlearn_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-visionlearn}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - visionlearn_redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      # Context is the repo root (not ./backend) so the image can include
      # the top-level prompts/ directory — see backend/Dockerfile's header
      # comment for why the directory nesting must be preserved.
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-visionlearn}:${POSTGRES_PASSWORD:-visionlearn}@db:5432/${POSTGRES_DB:-visionlearn}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # Host port 8001, not 8000 — some environments have another local
      # process bound to 127.0.0.1:8000, which wins over Docker's wildcard
      # bind for anything addressed as `localhost:8000`. The container's
      # internal port (right side) is unaffected and still 8000, which is
      # why the healthcheck below (run inside the container) is unchanged.
      - "8001:8000"
    volumes:
      - ./backend/app:/workspace/backend/app
      - ./prompts:/workspace/prompts:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  visionlearn_pgdata:
  visionlearn_redisdata:
